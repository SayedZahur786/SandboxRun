[package]
name = "sandboxrun"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded WASM execution for agent-generated code"

[dependencies]
anyhow = "1"
wasmtime = { version = "=50.0.2", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=50.0.2", features = ["p1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
vercel_runtime = { version = "2", features = ["axum"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
subtle = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"

[[bin]]
name = "run"
path = "api/run.rs"

[[bin]]
name = "sandboxrun-server"
path = "src/main.rs"

[dev-dependencies]
wat = "1"

[profile.release]
opt-level = 2
strip = true
